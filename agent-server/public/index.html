<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>卓橦の简历问答 Agent</title>
<style>
  :root{
    --bg:#0f1115; --card:#171a21; --line:#262b36; --txt:#e7eaf0;
    --sub:#9aa3b2; --accent:#5b8cff; --accent2:#7ee0c0; --chip:#1b2030;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,"PingFang SC","Microsoft YaHei",Segoe UI,Roboto,sans-serif;
    background:linear-gradient(160deg,#0c0e12,#11151d);color:var(--txt);min-height:100vh;display:flex;justify-content:center}
  .wrap{width:100%;max-width:760px;padding:22px 14px 28px;display:flex;flex-direction:column;height:100vh}
  header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
  .title{font-size:18px;font-weight:700}
  .title small{color:var(--sub);font-weight:400;font-size:12px;display:block;margin-top:2px}
  .lang{display:flex;gap:6px}
  .lang button{background:var(--card);color:var(--sub);border:1px solid var(--line);padding:6px 12px;border-radius:8px;cursor:pointer;font-size:13px;transition:.15s}
  .lang button.on{color:#fff;border-color:var(--accent);background:#1d2740}
  .box{flex:1;overflow-y:auto;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:10px;scroll-behavior:smooth}
  .msg{margin-bottom:14px;line-height:1.6;font-size:14px;white-space:pre-wrap;animation:fade .25s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .msg .who{font-size:11px;color:var(--sub);margin-bottom:4px}
  .q{background:#1b2030;border-left:3px solid var(--accent);padding:9px 11px;border-radius:8px}
  .a{background:#15241f;border-left:3px solid var(--accent2);padding:9px 11px;border-radius:8px}
  .degraded{font-size:11px;color:#e0b35b;margin-top:5px}
  /* 推荐问题区 */
  .suggest{margin-bottom:10px}
  .suggest .label{font-size:12px;color:var(--sub);margin-bottom:7px;display:flex;align-items:center;gap:6px}
  .suggest .label::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent2);display:inline-block}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{background:var(--chip);color:#cdd5e4;border:1px solid var(--line);padding:8px 13px;border-radius:999px;font-size:13px;cursor:pointer;transition:.15s;line-height:1.3}
  .chip:hover{border-color:var(--accent);color:#fff;transform:translateY(-1px)}
  .chip:active{transform:translateY(0)}
  .input{display:flex;gap:8px}
  .input input{flex:1;background:#0e1117;border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:12px;font-size:14px;outline:none;transition:.15s}
  .input input:focus{border-color:var(--accent)}
  .input button{background:var(--accent);color:#fff;border:none;padding:0 18px;border-radius:10px;font-size:14px;cursor:pointer;transition:.15s}
  .input button:disabled{opacity:.5;cursor:not-allowed}
  .hint{color:var(--sub);font-size:12px;text-align:center;margin-top:8px}
  /* 打字指示器 */
  .typing{display:flex;gap:4px;padding:4px 2px}
  .typing span{width:7px;height:7px;border-radius:50%;background:var(--sub);animation:blink 1.2s infinite both}
  .typing span:nth-child(2){animation-delay:.2s}
  .typing span:nth-child(3){animation-delay:.4s}
  @keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="title">卓橦の简历问答 Agent <small>基于简历知识库 · Deepseek 驱动</small></div>
    <div class="lang">
      <button id="btnZh" class="on" onclick="setLang('zh')">中文</button>
      <button id="btnEn" onclick="setLang('en')">EN</button>
    </div>
  </header>

  <div class="box" id="box"></div>

  <div class="suggest" id="suggest">
    <div class="label" id="suggestLabel">HR 常问问题（点击即可提问）</div>
    <div class="chips" id="chips"></div>
  </div>

  <div class="input">
    <input id="q" placeholder="问我关于卓橦的实习、能力、规划…" onkeydown="if(event.key==='Enter')ask()" />
    <button id="send" onclick="ask()">发送</button>
  </div>
  <div class="hint" id="hint">所有回答均来自卓橦的简历与问答库，不会编造信息。</div>
</div>
<script>
let lang = 'zh';
let SUGGESTIONS = [];

const I18N = {
  zh:{
    placeholder:'问我关于卓橦的实习、能力、规划…',
    label:'HR 常问问题（点击即可提问）',
    greeting:'你好，我是卓橦的简历问答 Agent 👋\n你可以直接提问，也可以点击下方的高频问题，快速了解我的实习经历、专业能力、职业规划等。',
    thinking:'正在思考…',
    err:'网络错误，请重试。'
  },
  en:{
    placeholder:'Ask me about Zhuotong — internships, skills, plans…',
    label:'Common questions from recruiters (tap to ask)',
    greeting:"Hi, I'm Zhuotong's resume Q&A agent 👋\nType your own question, or tap a common question below to learn about my internships, skills, and career plan.",
    thinking:'Thinking…',
    err:'Network error, please retry.'
  }
};

const box = document.getElementById('box');

function escapeHtml(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}

function addMsg(role, text, degraded){
  const d = document.createElement('div');
  d.className = 'msg';
  const who = role==='q' ? (lang==='zh'?'你':'You') : (lang==='zh'?'卓橦 Agent':'Zhuotong Agent');
  d.innerHTML = `<div class="who">${who}</div><div class="${role==='q'?'q':'a'}">${escapeHtml(text)}</div>`
    + (degraded?`<div class="degraded">⚠ ${lang==='zh'?'当前为资料库兜底内容，未调用模型':'Fallback from knowledge base (model not called)'}</div>`:'');
  box.appendChild(d);
  box.scrollTop = box.scrollHeight;
}

function addTyping(){
  const d = document.createElement('div');
  d.className = 'msg'; d.id = 'typingMsg';
  d.innerHTML = `<div class="who">${lang==='zh'?'卓橦 Agent':'Zhuotong Agent'}</div><div class="a"><div class="typing"><span></span><span></span><span></span></div></div>`;
  box.appendChild(d);
  box.scrollTop = box.scrollHeight;
}
function removeTyping(){ const t=document.getElementById('typingMsg'); if(t) t.remove(); }

function renderChips(){
  document.getElementById('suggestLabel').textContent = I18N[lang].label;
  const wrap = document.getElementById('chips');
  wrap.innerHTML = '';
  SUGGESTIONS.forEach(item=>{
    const b = document.createElement('button');
    b.className = 'chip';
    b.textContent = item[lang];
    b.onclick = ()=> sendSuggestion(item[lang]);
    wrap.appendChild(b);
  });
}

function setLang(l){
  lang = l;
  document.getElementById('btnZh').className = l==='zh'?'on':'';
  document.getElementById('btnEn').className = l==='en'?'on':'';
  document.getElementById('q').placeholder = I18N[l].placeholder;
  document.getElementById('hint').textContent = l==='zh'
    ? '所有回答均来自卓橦的简历与问答库，不会编造信息。'
    : 'All answers come from Zhuotong’s resume & Q&A base — no invented info.';
  renderChips();
}

async function ask(){
  const input = document.getElementById('q');
  const text = input.value.trim();
  if(!text) return;
  await dispatch(text);
  input.value='';
}

async function sendSuggestion(text){
  const input = document.getElementById('q');
  input.value = text;       // 回填到输入框，HR 可见自己点了什么
  await dispatch(text);
  input.value='';
}

async function dispatch(text){
  addMsg('q', text);
  const btn = document.getElementById('send'); btn.disabled=true;
  addTyping();
  try{
    const r = await fetch('/api/ask',{method:'POST',headers:{'Content-Type':'application/json'},
      body: JSON.stringify({question:text, lang})});
    const data = await r.json();
    removeTyping();
    addMsg('a', data.answer||'(无回答)', data.degraded);
  }catch(e){
    removeTyping();
    addMsg('a', I18N[lang].err);
  }finally{ btn.disabled=false; }
}

// 初始化：拉取推荐问题 + 欢迎语
(async function init(){
  try{
    const r = await fetch('/api/questions');
    const data = await r.json();
    SUGGESTIONS = data.questions || [];
  }catch(e){ SUGGESTIONS = []; }
  renderChips();
  addMsg('a', I18N[lang].greeting);
})();
</script>
</body>
</html>
